[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-recent-sync"
version = "0.3.0"
description = "Account-based Claude Desktop context and memory transfer with encrypted Mac migration packages."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Beiciccc" }
]
keywords = ["claude", "claude-code", "desktop", "sessions", "sync"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities"
]

[project.scripts]
claude-recent-sync = "claude_recent_sync.cli:main"
claude-recent-sync-ui = "claude_recent_sync.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_recent_sync"]
exclude = ["**/* *.py"]
